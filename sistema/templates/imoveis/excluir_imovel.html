{% extends 'base.html' %}

{% block title %}Excluir Imóvel - AlugaFácil{% endblock %}

{% block content %}
<div class="form-container text-center">
    <i class="fa-solid fa-triangle-exclamation text-danger fa-3x mb-3"></i>
    <h3 class="fw-bold text-danger">Confirmar Exclusão</h3>
    <p class="my-3">Tem certeza que deseja apagar o anúncio <strong>"{{ imovel.titulo }}"</strong>?</p>
    <p class="text-muted small mb-4">Esta ação não poderá ser desfeita.</p>

    <form method="POST">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <a href="{% url 'imoveis:meu_painel' %}" class="btn btn-outline-secondary w-50">Cancelar</a>
            <button type="submit" class="btn btn-danger w-50">
                <i class="fa-solid fa-trash me-1"></i>Sim, Excluir
            </button>
        </div>
    </form>
</div>
{% endblock %}
