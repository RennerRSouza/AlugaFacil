{% extends 'base.html' %}

{% block title %}Excluir Imóvel - AlugaFácil{% endblock %}

{% block content %}
<div class="form-container" style="text-align: center;">
    <h2 style="color: #dc2626;">Confirmar Exclusão</h2>
    
    <p style="font-size: 16px; margin: 20px 0;">
        Tem certeza que deseja apagar o anúncio <strong>"{{ imovel.titulo }}"</strong>?
    </p>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">
        Esta ação não poderá ser desfeita.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="btn-group">
            <a href="{% url 'imoveis:meu_painel' %}" class="btn-cancel">Cancelar</a>
            <button type="submit" style="background-color: #dc2626;">Sim, Excluir</button>
        </div>
    </form>
</div>
{% endblock %}
