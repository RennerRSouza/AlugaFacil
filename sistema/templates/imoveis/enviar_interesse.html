{% extends 'base.html' %}

{% block title %}Enviar Proposta - AlugaFácil{% endblock %}

{% block content %}
<div class="form-container">
    <a href="{% url 'imoveis:detalhes' imovel.id %}" class="text-decoration-none small fw-semibold">
        <i class="fa-solid fa-arrow-left me-1"></i>Voltar para o Imóvel
    </a>
    
    <h3 class="fw-bold mt-3">Demonstrar Interesse</h3>
    <p class="text-muted mb-4">Enviando proposta para <strong>{{ imovel.titulo }}</strong>.</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-success w-100 mt-3 fw-semibold">
            <i class="fa-solid fa-paper-plane me-1"></i>Enviar Mensagem
        </button>
    </form>
</div>
{% endblock %}
