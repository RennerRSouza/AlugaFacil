{% extends 'base.html' %}

{% block title %}Anunciar Imóvel - AlugaFácil{% endblock %}

{% block content %}
<div
    style="max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

    <a href="{% url 'imoveis:home' %}" style="text-decoration: none; color: #007bff;">&larr; Cancelar e Voltar</a>

    <h2 style="color: #333; margin-top: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
        {% if editando %}
        Editar Imóvel: {{ form.instance.titulo }}
        {% else %}
        Anunciar Novo Imóvel
        {% endif %}
    </h2>

    <form method="POST" enctype="multipart/form-data" style="margin-top: 20px;">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
            style="width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px;">
            {% if editando %}
            Salvar Alterações
            {% else %}
            Publicar Anúncio
            {% endif %}
        </button>
    </form>
</div>
{% endblock %}
