{% extends 'base.html' %}

{% block title %}Criar Conta - AlugaFácil{% endblock %}

{% block content %}
<div class="form-container">
    <h3 class="fw-bold text-center mb-4">
        <i class="fa-solid fa-user-plus text-primary me-2"></i>Criar Conta
    </h3>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-success w-100 mt-3 fw-semibold">Cadastrar</button>
    </form>
    
    <p class="text-center mt-3 mb-0 small text-muted">
        Já tem uma conta? <a href="{% url 'login' %}">Faça login aqui</a>
    </p>
</div>
{% endblock %}
