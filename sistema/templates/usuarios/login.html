{% extends 'base.html' %}

{% block title %}Entrar - AlugaFácil{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center;">Acessar Conta</h2>

    {% if form.errors %}
        <ul class="errorlist" style="text-align: center; list-style: none; padding: 0; margin-bottom: 15px;">
            <li>Usuário ou senha incorretos. Tente novamente.</li>
        </ul>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Usuário:</label>
            <input type="text" name="username" id="id_username" required>
        </div>

        <div class="form-group">
            <label for="id_password">Senha:</label>
            <input type="password" name="password" id="id_password" required>
        </div>

        <div class="btn-group">
            <button type="submit">Entrar</button>
        </div>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #64748b;">
        Ainda não tem conta? <a href="{% url 'usuarios:cadastro' %}" style="color: var(--primary-color); font-weight: 500;">Cadastre-se</a>
    </p>
</div>
{% endblock %}
