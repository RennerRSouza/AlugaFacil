{% extends 'base.html' %}

{% block title %}Entrar - AlugaFácil{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    
    <h2 style="color: #333; text-align: center; margin-bottom: 20px;">Acessar Conta</h2>

    {% if form.errors %}
        <p style="color: red; text-align: center; font-size: 14px;">Usuário ou senha incorretos. Tente novamente.</p>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #555;">Usuário:</label>
            <input type="text" name="username" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; color: #555;">Senha:</label>
            <input type="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">Entrar</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 14px;">
        Ainda não tem conta? <a href="#" style="color: #007bff;">Cadastre-se</a>
    </p>
</div>
{% endblock %}
