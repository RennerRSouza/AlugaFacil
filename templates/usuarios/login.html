{% extends 'base.html' %}

{% block title %}Entrar - AlugaFácil{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 420px;">
    <h3 class="fw-bold text-center mb-4">
        <i class="fa-solid fa-right-to-bracket text-primary me-2"></i>Acessar Conta
    </h3>

    {% if form.errors %}
        <div class="alert alert-danger py-2 small text-center">Usuário ou senha incorretos.</div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Usuário</label>
            <input type="text" name="username" id="id_username" class="form-control" required>
        </div>
        <div class="mb-4">
            <label for="id_password" class="form-label fw-semibold">Senha</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">Entrar</button>
    </form>
    
    <p class="text-center mt-3 mb-0 small text-muted">
        Ainda não tem conta? <a href="{% url 'usuarios:cadastro' %}">Cadastre-se</a>
    </p>
</div>
{% endblock %}
